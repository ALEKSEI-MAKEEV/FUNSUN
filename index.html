<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Инфо-лист</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;
  --card:#ffffff;
  --card2:#f8f9fb;
  --acc:#0b8457;
  --acc2:#0ea56d;
  --acc-light:#e8f5ee;
  --blue:#2563eb;
  --blue-light:#eff4ff;
  --amber:#d97706;
  --amber-light:#fef9eb;
  --red:#dc2626;
  --red-light:#fef2f2;
  --txt:#1a1a1a;
  --txt2:#6b7280;
  --txt3:#9ca3af;
  --brd:#e5e7eb;
  --brd2:#d1d5db;
  --inp:#f9fafb;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow2:0 4px 12px rgba(0,0,0,.08);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:12px}
.w{max-width:520px;margin:0 auto;padding-bottom:76px}

.hd{text-align:center;padding:20px 0 16px}
.hd h1{font-size:20px;font-weight:900;color:var(--acc)}
.hd p{color:var(--txt2);font-size:11px;margin-top:3px;font-weight:500}

.cd{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--brd);box-shadow:var(--shadow)}
.lb{font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.rw{display:flex;gap:8px;margin-bottom:8px}
.rw:last-child{margin-bottom:0}
.rw>div{flex:1}

input,textarea{
  width:100%;background:var(--inp);border:1.5px solid var(--brd);border-radius:8px;
  padding:10px 12px;color:var(--txt);font-family:'Inter',sans-serif;font-size:14px;
  outline:none;transition:border-color .15s;
}
input:focus,textarea:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
input[type=date],input[type=time]{cursor:pointer;color:var(--txt)}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{
  cursor:pointer;opacity:.5;
}
textarea{resize:none}

/* point card */
.pt{
  background:var(--card);border-radius:var(--r);margin-bottom:10px;
  border:1px solid var(--brd);box-shadow:var(--shadow);overflow:hidden;
}
.pt-head{
  display:flex;align-items:center;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--brd);background:var(--card2);
}
.pt-head input[type=time]{
  width:90px;flex-shrink:0;font-weight:700;font-size:15px;padding:8px;text-align:center;
}
.pt-head input[type=text]{flex:1;font-weight:700;text-transform:uppercase;font-size:13px}
.pt-head .del{
  background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer;
  padding:2px 6px;border-radius:6px;transition:all .15s;
}
.pt-head .del:hover{color:var(--red);background:var(--red-light)}

.badge{
  font-size:9px;font-weight:800;padding:3px 8px;border-radius:6px;
  flex-shrink:0;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
}
.badge.a{background:var(--acc-light);color:var(--acc)}
.badge.b{background:var(--blue-light);color:var(--blue)}
.badge.c{background:var(--amber-light);color:var(--amber)}

.pt-body{padding:12px 14px}

.place-row{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.place-row .arrow{font-size:13px;color:var(--txt3);flex-shrink:0;font-weight:700}
.place-row input{font-size:13px;font-weight:700;text-transform:uppercase}

.sat{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sat input{flex:1;font-size:13px;padding:9px 10px;font-weight:600;text-transform:uppercase}
.sat .x{
  background:none;border:none;color:var(--txt3);font-size:16px;cursor:pointer;
  padding:2px 6px;border-radius:6px;
}
.sat .x:hover{color:var(--red)}

.plus{
  width:100%;padding:8px;background:var(--card2);border:1.5px dashed var(--brd2);
  border-radius:8px;color:var(--acc);font-family:'Inter',sans-serif;font-size:11px;
  font-weight:700;cursor:pointer;margin-top:4px;transition:all .15s;
}
.plus:hover{border-color:var(--acc);background:var(--acc-light)}

/* checkbox & note */
.opts{margin-top:10px;padding-top:10px;border-top:1px solid var(--brd)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin-bottom:6px}
.chk input[type=checkbox]{
  width:18px;height:18px;accent-color:var(--acc);cursor:pointer;flex-shrink:0;
}
.chk span{font-size:12px;font-weight:600;color:var(--txt2)}

.note-wrap{margin-top:8px}
.note-wrap textarea{font-size:12px;padding:8px 10px;min-height:36px}

/* modal */
.modal-bg{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:380px;
  box-shadow:var(--shadow2);
}
.modal h3{font-size:15px;font-weight:800;color:var(--txt);margin-bottom:14px;text-align:center}
.mbtn{
  width:100%;padding:14px;background:var(--card2);border:1.5px solid var(--brd);
  border-radius:10px;color:var(--txt);font-family:'Inter',sans-serif;font-size:13px;
  font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left;transition:all .15s;
}
.mbtn:hover{border-color:var(--acc);background:var(--acc-light)}
.mbtn:last-of-type{margin-bottom:0}
.mbtn .ico{font-size:16px;margin-right:6px}
.mbtn small{display:block;font-size:10px;color:var(--txt3);font-weight:500;margin-top:2px;margin-left:26px}
.mcancel{
  width:100%;padding:10px;background:transparent;border:none;
  color:var(--txt3);font-family:'Inter',sans-serif;font-size:12px;
  font-weight:600;cursor:pointer;margin-top:8px;
}

/* add button */
.badd{
  width:100%;padding:12px;background:var(--card);border:2px dashed var(--brd2);
  border-radius:var(--r);color:var(--acc);font-family:'Inter',sans-serif;font-size:13px;
  font-weight:800;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow);transition:all .15s;
}
.badd:hover{border-color:var(--acc);background:var(--acc-light)}

.sticky{
  position:fixed;bottom:0;left:0;right:0;padding:10px 12px;
  background:linear-gradient(transparent,var(--bg) 35%);z-index:50;
  display:flex;justify-content:center;
}
.bgo{
  width:100%;max-width:520px;padding:14px;
  background:var(--acc);border:none;border-radius:10px;
  color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:800;
  cursor:pointer;box-shadow:0 4px 14px rgba(11,132,87,.3);transition:all .15s;
}
.bgo:hover{background:var(--acc2);box-shadow:0 6px 20px rgba(11,132,87,.35)}
.bgo:active{transform:scale(.98)}

/* preview */
.pv{
  background:var(--card);border-radius:var(--r);margin-top:10px;
  border:2px solid var(--acc);overflow:hidden;display:none;box-shadow:var(--shadow2);
}
.pv.show{display:block}
.pvt{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;background:var(--acc-light);border-bottom:1px solid var(--brd);
}
.pvt h3{font-size:12px;font-weight:800;color:var(--acc)}
.bcp{
  padding:8px 18px;border:none;border-radius:8px;background:var(--acc);color:#fff;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
  transition:all .15s;
}
.bcp:hover{background:var(--acc2)}
.bcp.ok{background:#16a34a}
.mo{
  padding:16px;white-space:pre-wrap;word-break:break-word;
  font-size:14px;line-height:1.75;background:var(--card2);
  max-height:55vh;overflow-y:auto;color:var(--txt);
}

/* clear button */
.bclear{
  display:block;margin:0 auto 10px;padding:6px 16px;
  background:transparent;border:1px solid var(--brd);border-radius:8px;
  color:var(--txt3);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  cursor:pointer;
}
.bclear:hover{color:var(--red);border-color:var(--red)}

@media(max-width:440px){
  .rw{flex-wrap:wrap}.rw>div{flex:1 1 100%}
  .pt-head{flex-wrap:wrap}
  .pt-head input[type=time]{width:80px}
}
</style>
</head>
<body>
<div class="w">

<div class="hd">
  <h1>📋 Инфо-лист</h1>
  <p>Заполни → скопируй → WhatsApp</p>
</div>

<div class="cd">
  <div class="rw">
    <div><div class="lb">Имя гида</div><input id="nm" placeholder="Агабек Рустем"></div>
  </div>
  <div class="rw">
    <div><div class="lb">Заезд (ARR)</div><input type="date" id="ar"></div>
    <div><div class="lb">Дата инфо</div><input type="date" id="inf"></div>
  </div>
</div>

<div id="list"></div>
<button class="badd" onclick="showModal()">＋ Добавить точку</button>
<button class="bclear" onclick="clearAll()">🗑 Очистить всё</button>

<div class="pv" id="pv">
  <div class="pvt">
    <h3>💬 Сообщение</h3>
    <button class="bcp" id="cb" onclick="copyMsg()">📋 Копировать</button>
  </div>
  <div class="mo" id="mo"></div>
</div>

</div>

<!-- modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Тип точки</h3>
    <button class="mbtn" onclick="addPt('a')">
      <span class="ico">🏨</span> Отель
      <small>Один отель — одна строка</small>
    </button>
    <button class="mbtn" onclick="addPt('b')">
      <span class="ico">➡️</span> Сбор отеля в другом отеле
      <small>Отель едет на сбор в другой отель</small>
    </button>
    <button class="mbtn" onclick="addPt('c')">
      <span class="ico">📍</span> Сбор отелей в точке
      <small>Несколько отелей едут в точку сбора (точка не в списке)</small>
    </button>
    <button class="mcancel" onclick="hideModal()">Отмена</button>
  </div>
</div>

<div class="sticky"><button class="bgo" onclick="gen()">📤 Сформировать сообщение</button></div>

<script>
function showModal(){document.getElementById('modal').classList.add('show')}
function hideModal(){document.getElementById('modal').classList.remove('show')}

let pn=0;

function addPt(type){
  hideModal();
  pn++;
  const id=pn;
  const d=document.createElement('div');
  d.className='pt';
  d.dataset.type=type;
  d.dataset.pid=id;

  let head='', body='';

  if(type==='a'){
    head=`
      <span class="badge a">Отель</span>
      <input type="time" class="ti">
      <input type="text" class="hi" placeholder="Название отеля">
    `;
    body=``;
  } else if(type==='b'){
    head=`
      <span class="badge b">В другом</span>
      <input type="time" class="ti">
      <input type="text" class="hi" placeholder="Отель который едет">
    `;
    body=`
      <div class="place-row">
        <span class="arrow">→ в отеле</span>
        <input type="text" class="place" placeholder="Точка сбора">
      </div>
    `;
  } else {
    head=`
      <span class="badge c">Сбор</span>
      <input type="time" class="ti">
      <input type="text" class="hi" placeholder="Точка сбора (не в списке)">
    `;
    body=`
      <div class="sats" id="s${id}"></div>
      <button class="plus" onclick="addSat(${id})">＋ ещё отель</button>
    `;
  }

  d.innerHTML=`
    <div class="pt-head">
      ${head}
      <button class="del" onclick="this.closest('.pt').remove();save()">✕</button>
    </div>
    <div class="pt-body">
      ${body}
      <div class="opts">
        <label class="chk"><input type="checkbox" class="dd"><span>‼️ День в день</span></label>
        <div class="note-wrap">
          <div class="lb">Заметка</div>
          <textarea class="nt" placeholder="Примечание к этой точке..." rows="1"></textarea>
        </div>
      </div>
    </div>
  `;

  document.getElementById('list').appendChild(d);
  if(type==='c') addSat(id);
  save();
}

function addSat(pid){
  const area=document.getElementById('s'+pid);
  const d=document.createElement('div');
  d.className='sat';
  d.innerHTML=`<input type="text" placeholder="Название отеля"><button class="x" onclick="rmSat(this)">✕</button>`;
  area.appendChild(d);
}

function rmSat(btn){
  const row=btn.closest('.sat');
  const area=row.parentElement;
  if(area.querySelectorAll('.sat').length>1) row.remove();
}

function fmtDate(val){
  if(!val) return '';
  const d=new Date(val);
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  return dd+'.'+mm;
}

function fmtTime(val){
  if(!val) return '';
  return val.replace(':',':');
}

function gen(){
  const nm=document.getElementById('nm').value.trim();
  const ar=fmtDate(document.getElementById('ar').value);
  const inf=fmtDate(document.getElementById('inf').value);

  let m='';
  if(nm) m+=nm+'\n';
  if(ar) m+='ARR '+ar+'\n';
  if(inf) m+='Info '+inf+'\n';
  m+='\n';

  let num=0;

  document.querySelectorAll('.pt').forEach(pt=>{
    const type=pt.dataset.type;
    const time=fmtTime(pt.querySelector('.ti').value);
    const main=pt.querySelector('.hi').value.trim();
    const isDD=pt.querySelector('.dd')?.checked;
    const note=pt.querySelector('.nt')?.value.trim()||'';
    const ddTxt=isDD?' ‼️*день в день*‼️':'';

    if(type==='a'){
      if(!main&&!time) return;
      num++;
      m+=`${num})${main}-${time}${ddTxt}\n`;
      if(note) m+=`   _${note}_\n`;

    } else if(type==='b'){
      const place=pt.querySelector('.place')?.value.trim()||'';
      if(!main) return;
      num++;
      if(place){
        m+=`${num})${main}-${time}(⚠️в отеле *${place}*⚠️)${ddTxt}\n`;
      } else {
        m+=`${num})${main}-${time}${ddTxt}\n`;
      }
      if(note) m+=`   _${note}_\n`;

    } else if(type==='c'){
      const place=main;
      pt.querySelectorAll('.sat input[type=text]').forEach(inp=>{
        const name=inp.value.trim();
        if(!name) return;
        num++;
        if(place){
          m+=`${num})${name}-${time}(⚠️в отеле *${place}*⚠️)${ddTxt}\n`;
        } else {
          m+=`${num})${name}-${time}${ddTxt}\n`;
        }
      });
      if(note) m+=`   _${note}_\n`;
    }
  });

  m=m.trimEnd();
  document.getElementById('mo').textContent=m;
  document.getElementById('pv').classList.add('show');
  resetCopyBtn();
  save();
  setTimeout(()=>document.getElementById('pv').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

function copyMsg(){
  const text=document.getElementById('mo').textContent;
  // fallback for mobile
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopied).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0,999999);
  try{document.execCommand('copy');onCopied()}catch(e){alert('Не удалось скопировать, выделите текст вручную')}
  document.body.removeChild(ta);
}

function onCopied(){
  const b=document.getElementById('cb');
  b.textContent='✓ Скопировано!';b.classList.add('ok');
  setTimeout(resetCopyBtn,2500);
}

function resetCopyBtn(){
  const b=document.getElementById('cb');
  b.textContent='📋 Копировать';b.classList.remove('ok');
}

// === SAVE / LOAD ===
function save(){
  try{
    const data={
      nm:document.getElementById('nm').value,
      ar:document.getElementById('ar').value,
      inf:document.getElementById('inf').value,
      pts:[]
    };
    document.querySelectorAll('.pt').forEach(pt=>{
      const obj={
        type:pt.dataset.type,
        time:pt.querySelector('.ti').value,
        main:pt.querySelector('.hi').value,
        dd:pt.querySelector('.dd')?.checked||false,
        note:pt.querySelector('.nt')?.value||'',
      };
      if(pt.dataset.type==='b'){
        obj.place=pt.querySelector('.place')?.value||'';
      }
      if(pt.dataset.type==='c'){
        obj.sats=[];
        pt.querySelectorAll('.sat input[type=text]').forEach(i=>obj.sats.push(i.value));
      }
      data.pts.push(obj);
    });
    localStorage.setItem('infosheet',JSON.stringify(data));
  }catch(e){}
}

function load(){
  try{
    const raw=localStorage.getItem('infosheet');
    if(!raw) return;
    const data=JSON.parse(raw);
    document.getElementById('nm').value=data.nm||'';
    document.getElementById('ar').value=data.ar||'';
    document.getElementById('inf').value=data.inf||'';
    (data.pts||[]).forEach(p=>{
      addPt(p.type);
      const pt=document.getElementById('list').lastElementChild;
      pt.querySelector('.ti').value=p.time||'';
      pt.querySelector('.hi').value=p.main||'';
      if(p.dd) pt.querySelector('.dd').checked=true;
      pt.querySelector('.nt').value=p.note||'';
      if(p.type==='b'&&p.place){
        pt.querySelector('.place').value=p.place;
      }
      if(p.type==='c'&&p.sats){
        const pid=pt.dataset.pid;
        const area=document.getElementById('s'+pid);
        // remove the default one
        area.innerHTML='';
        p.sats.forEach(s=>{
          addSat(parseInt(pid));
          area.lastElementChild.querySelector('input').value=s;
        });
      }
    });
  }catch(e){}
}

function clearAll(){
  if(!confirm('Очистить все данные?')) return;
  localStorage.removeItem('infosheet');
  document.getElementById('nm').value='';
  document.getElementById('ar').value='';
  document.getElementById('inf').value='';
  document.getElementById('list').innerHTML='';
  document.getElementById('pv').classList.remove('show');
  pn=0;
}

// auto-save on any input
document.addEventListener('input',()=>setTimeout(save,300));
document.addEventListener('change',()=>setTimeout(save,300));

// load on start
load();
</script>
</body>
</html>
